<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f7f6f1">
    <title>ヨクジツ|学習の復習</title>
    <!-- ?v= の数字は版番号。ブラウザが覚えている古い styles.css / app.js を使い回さないために付けている。
         コードを変えたら、ここの2か所・app.js の APP_VERSION・sw.js の CACHE を一緒に増やす。 -->
    <link rel="stylesheet" href="styles.css?v=6">
    <script src="app.js?v=6" defer></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
  </head>
  <body>
    <div class="shell">
      <nav class="rail" aria-label="画面の切り替え">
      <div class="brand">ヨクジツ</div>
      <button data-view="review" class="active"><span class="icon" aria-hidden="true">▤</span>復習<span id="remaining"></span></button>
      <button data-view="record"><span class="icon" aria-hidden="true">✎</span>記録</button>
      <button data-view="history"><span class="icon" aria-hidden="true">▥</span>履歴</button>
   </nav>
   <main>
     <div class="row"><time id="today-label">2026年10月18日（日）</time><span id="streak" class="small"></span></div>
     <p id="notice" role="status" aria-live="polite"></p>
     <section id="review-screen">
      <div class="row"><h1>今日の復習</h1><button id="done" class="primary">完了 ✓</button></div>
      <div class="genre-field">
        <span id="review-genre-label">ジャンル</span>
        <button type="button" id="review-genre" class="genre-button" aria-haspopup="dialog" aria-labelledby="review-genre-label review-genre-value"><span id="review-genre-value" class="genre-value">すべて</span><span class="genre-change" aria-hidden="true">選ぶ ▾</span></button>
      </div>
         <div id="progress" class="progress" aria-label="今日の進み具合"></div>
         <div id="review-card">
         <div class="row small"><span id="position">01 / 04</span><span id="studied-label">昨日の学習</span></div>
         <div id="card-genre" class="small card-genre"></div>
         <h2 id="review-title">二次関数の最大・最小</h2>
         <p id="question">y = x² − 4x + 1 の最小値は？</p>
         <div class="small">学んだこと</div>
         <div id="content" class="ruled">平方完成を使って考える。</div>
         <button id="reveal" class="reveal" aria-expanded="false">◎ タップして答えを見る</button>
         <p id="answer" class="answer" hidden></p>
         <button id="postpone" class="wide">◷ まだ不安なので明日へ →</button>
         <div class="row pager"><button id="prev">〈 前へ</button><span id="page-number">1 / 4</span><button id="next">次へ 〉</button></div>
      </div>
      <div id="empty" class="empty" hidden><h2 id="empty-title">今日の復習はありません。</h2><p id="empty-message"></p><button data-view="record">今日の学習を記録する →</button></div>
      <div id="queue"></div>
    </section>
    <section id="record-screen" hidden>
      <h1 id="form-heading">学習を記録</h1>
      <form id="record-form">
        <div class="genre-field">
          <span id="form-genre-label">ジャンル</span>
          <button type="button" id="form-genre" class="genre-button" aria-haspopup="dialog" aria-labelledby="form-genre-label form-genre-value"><span id="form-genre-value" class="genre-value"></span><span class="genre-change" aria-hidden="true">選ぶ ▾</span></button>
          <div class="genre-actions">
            <button type="button" id="add-genre" class="text-button" aria-haspopup="dialog">＋ ジャンルを追加</button>
            <button type="button" id="rename-genre" class="text-button" aria-haspopup="dialog">✎ 名前を変更</button>
            <button type="button" id="delete-genre" class="text-button" aria-haspopup="dialog">－ ジャンルを削除</button>
          </div>
        </div>
        <label>タイトル（必須）<input id="title" required maxlength="200"></label>
        <label>学んだこと<textarea id="learned" maxlength="40000"></textarea></label>
        <label>学習日<input id="studied" type="date" required></label>
        <label>復習日 <small>自動</small><input id="review-date" type="date" readonly></label>
        <details id="quiz-fields"><summary>＋ 復習用の質問と答えを追加する</summary>
          <label>質問<textarea id="quiz-question" maxlength="4000"></textarea></label>
          <label>答え<textarea id="quiz-answer" maxlength="8000"></textarea></label>
        </details>
        <p id="form-error" role="alert"></p>
        <button class="primary wide" type="submit" id="submit-record">記録する →</button>
        <button type="button" id="cancel-edit" hidden>編集を取り消す</button>
      </form>
    </section>
    <section id="complete-screen" hidden>
      <div class="complete-mark" aria-hidden="true">記</div><h2>記録しました</h2>
      <p id="recorded-date" class="done-date"></p>
      <button data-view="record" class="wide">続けて記録する</button>
      <button data-view="history" class="wide">履歴で確認する</button>
    </section>
    <section id="history-screen" hidden>
      <h1>学習履歴</h1>
      <div class="genre-field">
        <span id="history-genre-label">ジャンル</span>
        <button type="button" id="history-genre" class="genre-button" aria-haspopup="dialog" aria-labelledby="history-genre-label history-genre-value"><span id="history-genre-value" class="genre-value">すべて</span><span class="genre-change" aria-hidden="true">選ぶ ▾</span></button>
      </div>
      <div id="history-list"></div>
    </section>
    <footer>
      <p>記録はこの端末・このブラウザに保存。端末間の同期はしません。</p>
      <button id="export-data">記録を書き出す</button><button id="import-data">記録を読み込む</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="storage-status" role="status"></p>
    </footer>
    <p id="offline-status" class="small" role="status"></p>
    <button type="button" id="reload-app" hidden>再読み込みして新しい版に切り替える</button>
    <p id="app-version" class="small"></p>
  </main>
</div>
<dialog id="detail-dialog" aria-labelledby="detail-title">
  <div class="row"><h2 id="detail-title">学習記録の詳細</h2><button id="close-detail">閉じる ×</button></div>
  <div id="detail-body"></div>
  <div class="row"><button id="edit-record">編集する</button><button id="delete-record">削除する</button></div>
</dialog>
<dialog id="genre-dialog" class="picker" aria-labelledby="genre-dialog-title">
  <div class="row"><h2 id="genre-dialog-title" tabindex="-1">ジャンルを選ぶ</h2><button type="button" id="close-genre">閉じる ×</button></div>
  <label for="genre-search">ジャンルを検索（名前の一部でも探せます）</label>
  <input id="genre-search" type="search" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-describedby="genre-count">
  <p id="genre-count" class="small" role="status" aria-live="polite"></p>
  <ul id="genre-options" class="genre-options" aria-label="ジャンルの候補"></ul>
  <button type="button" id="genre-create" class="genre-create" hidden></button>
  <p id="genre-error" class="field-error" role="alert"></p>
</dialog>
<dialog id="genre-add-dialog" class="picker" aria-labelledby="genre-add-title">
  <form id="genre-add-form" novalidate>
    <h2 id="genre-add-title">ジャンルを追加</h2>
    <label for="genre-name">ジャンルの名前（30文字まで）</label>
    <input id="genre-name" maxlength="100" autocomplete="off" enterkeyhint="done" aria-describedby="genre-add-error">
    <p id="genre-add-error" class="field-error" role="alert"></p>
    <div class="row"><button type="button" id="cancel-genre-add">やめる</button><button type="submit" id="genre-add-submit" class="primary">追加する</button></div>
  </form>
</dialog>
<dialog id="genre-delete-dialog" class="picker" aria-labelledby="genre-delete-title" aria-describedby="genre-delete-text">
  <form id="genre-delete-form" novalidate>
    <h2 id="genre-delete-title">ジャンルを削除</h2>
    <p id="genre-delete-text"></p>
    <fieldset id="genre-delete-options" hidden>
      <legend>記録の扱い</legend>
      <label class="choice"><input type="radio" name="genre-delete-mode" id="genre-delete-move" value="move"><span>記録を別のジャンルへ移す</span></label>
      <p id="genre-delete-move-note" class="small" hidden>ほかのジャンルがないため、移すことはできません。</p>
      <div id="genre-delete-dest-field"><label for="genre-delete-dest">移し先のジャンル</label><select id="genre-delete-dest"></select></div>
      <label class="choice"><input type="radio" name="genre-delete-mode" id="genre-delete-remove" value="remove"><span>記録もいっしょに削除する（元に戻せません）</span></label>
    </fieldset>
    <p id="genre-delete-error" class="field-error" role="alert"></p>
    <div class="row"><button type="button" id="cancel-genre-delete">やめる</button><button type="submit" class="primary">削除する</button></div>
  </form>
</dialog>
</body>
</html>
